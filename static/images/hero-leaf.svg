<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-labelledby="title desc">
  <title id="title">Leaf illustration</title>
  <desc id="desc">A simple upright green leaf with a central vein.</desc>
  <defs>
    <linearGradient id="leafColor" x1=".12" y1=".08" x2=".86" y2=".92">
      <stop stop-color="#9fdf70"/>
      <stop offset=".32" stop-color="#43b760"/>
      <stop offset=".72" stop-color="#087e49"/>
      <stop offset="1" stop-color="#075033"/>
    </linearGradient>
    <linearGradient id="softLight" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f5ffd9" stop-opacity=".25"/>
      <stop offset=".52" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#003b26" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#8fda66"/>
      <stop offset=".5" stop-color="#e9ffb4"/>
      <stop offset="1" stop-color="#92d768"/>
    </linearGradient>
    <clipPath id="leafShape">
      <path d="M260 560C165 502 108 394 114 278 120 163 181 79 260 34 339 79 400 163 406 278 412 394 355 502 260 560Z"/>
    </clipPath>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="9" dy="14" stdDeviation="10" flood-color="#064b2e" flood-opacity=".2"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <path d="M260 560C165 502 108 394 114 278 120 163 181 79 260 34 339 79 400 163 406 278 412 394 355 502 260 560Z" fill="url(#leafColor)"/>
    <path d="M260 560C165 502 108 394 114 278 120 163 181 79 260 34 339 79 400 163 406 278 412 394 355 502 260 560Z" fill="url(#softLight)"/>
    <g clip-path="url(#leafShape)" fill="none" stroke-linecap="round">
      <path d="M260 556C260 413 260 190 260 39" stroke="url(#vein)" stroke-width="6"/>
      <path d="M260 475C211 451 166 420 128 380M260 414C207 393 166 364 120 323M260 350C211 334 170 308 123 263M260 287C217 273 183 249 139 205M260 225C224 211 198 190 164 153" stroke="#d9ffa2" stroke-opacity=".34" stroke-width="3"/>
      <path d="M260 475C309 451 354 420 392 380M260 414C313 393 354 364 400 323M260 350C309 334 350 308 397 263M260 287C303 273 337 249 381 205M260 225C296 211 322 190 356 153" stroke="#b9f087" stroke-opacity=".27" stroke-width="3"/>
      <path d="M181 93C149 171 145 260 168 336 185 393 213 440 244 477" stroke="#f3ffd4" stroke-opacity=".12" stroke-width="21"/>
    </g>
    <path d="M260 560C257 571 259 580 264 588" fill="none" stroke="#82bd59" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
