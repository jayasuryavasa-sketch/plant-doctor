<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" role="img" aria-labelledby="title desc">
  <title id="title">Natural plant leaf</title>
  <desc id="desc">A simple, softly shaded leaf with a central vein.</desc>
  <defs>
    <linearGradient id="green" x1=".12" y1=".06" x2=".88" y2=".94">
      <stop stop-color="#a7df70"/>
      <stop offset=".3" stop-color="#40b75f"/>
      <stop offset=".72" stop-color="#087b47"/>
      <stop offset="1" stop-color="#064a30"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity=".23"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#003923" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#a7e779"/>
      <stop offset=".55" stop-color="#e8ffb0"/>
      <stop offset="1" stop-color="#94d967"/>
    </linearGradient>
    <clipPath id="shape">
      <path d="M260 545C154 499 92 401 96 292 100 169 180 77 410 34 392 168 341 391 260 545Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="10" dy="15" stdDeviation="11" flood-color="#064b2e" flood-opacity=".22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <path d="M260 545C154 499 92 401 96 292 100 169 180 77 410 34 392 168 341 391 260 545Z" fill="url(#green)"/>
    <path d="M260 545C154 499 92 401 96 292 100 169 180 77 410 34 392 168 341 391 260 545Z" fill="url(#light)"/>
    <g clip-path="url(#shape)" fill="none" stroke-linecap="round">
      <path d="M260 541C286 405 343 184 407 38" stroke="url(#vein)" stroke-width="6"/>
      <path d="M270 485C214 464 158 435 108 399M281 429C218 411 155 378 101 337M294 369C229 351 169 322 108 272M310 307C255 293 204 266 146 215M326 248C282 234 238 211 190 165M345 190C315 180 282 161 244 123" stroke="#d9ffa2" stroke-opacity=".36" stroke-width="3"/>
      <path d="M271 485C321 463 363 435 395 405M282 429C336 406 379 376 412 342M294 369C347 347 389 318 423 282M309 307C359 287 399 260 428 225M325 248C364 232 395 211 421 181M343 191C370 180 391 163 411 141" stroke="#b9f087" stroke-opacity=".28" stroke-width="3"/>
      <path d="M157 106C125 179 123 264 151 337 169 383 199 425 238 458" stroke="#f3ffd4" stroke-opacity=".13" stroke-width="23"/>
    </g>
    <path d="M260 545C257 556 259 565 265 574" fill="none" stroke="#82bd59" stroke-width="7" stroke-linecap="round"/>
